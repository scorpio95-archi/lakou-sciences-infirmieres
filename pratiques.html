<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pratiques & Soins — Lakou Sces Infirmières</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
</head>
<body>

<div id="lakou-header"></div>

<div class="breadcrumb">
  <a href="index.html">🏠 Lakou Sces Infirmières</a>
  <span class="sep">›</span>
  <span class="current">Pratiques & Soins</span>
</div>

<section class="banniere-hero">
  <div class="banniere-hero-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21c-5-3.5-8-7-8-11a5 5 0 0110-1 5 5 0 0110 1c0 4-3 7.5-8 11z"/></svg>
  </div>
  <h1>Pratiques & Soins</h1>
  <p>Techniques de soins, protocoles étudiés, simulations et innovations étudiantes — des productions pédagogiques, pas un outil de prescription.</p>
</section>

<div class="filtres-bar">
  <input type="text" id="champ-recherche" placeholder="Rechercher un titre…">
  <select id="filtre-type">
    <option value="">Tous les types</option>
  </select>
</div>

<div class="archive-grid" id="grille-bannieres">
  <p class="auth-sub">Chargement…</p>
</div>

<footer class="site-footer">
  <p>Lakou Sces Infirmières — un réseau <a href="https://lakou-inivesite.example">Lakou Inivesite</a> · <a href="confidentialite.html">Confidentialité</a></p>
</footer>

<script src="bannieres.js"></script>
<script>
if (typeof initBanniere !== 'function') {
  document.getElementById('grille-bannieres').innerHTML = '<p class="auth-sub">Erreur : bannieres.js est introuvable. Vérifie qu\'il est bien déployé à la racine du site.</p>';
} else {
  initBanniere({
    table: 'infirmiere_pratiques_soins',
    champs: ['id','titre','description','contenu','fichier_url','type','created_at'],
    types: [
      ['technique_soins','Technique de soins'],
      ['tp_infirmier','TP infirmier'],
      ['protocole','Protocole étudié'],
      ['simulation','Simulation'],
      ['materiel_pedagogique','Matériel pédagogique'],
      ['innovation','Innovation étudiante']
    ]
  });
}
</script>
<script src="partials/nav.js"></script>
</body>
</html>
