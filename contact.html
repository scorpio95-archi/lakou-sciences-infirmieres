<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Lakou Sces Infirmières</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
</head>
<body>

<div id="lakou-header"></div>

<div class="breadcrumb">
  <a href="index.html">🏠 Lakou Sces Infirmières</a>
  <span class="sep">›</span>
  <span class="current">Contact</span>
</div>

<main class="auth-main">
  <div class="auth-card">
    <div class="auth-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16v12H4z"/><path d="M4 7l8 6 8-6"/></svg>
    </div>
    <h1>Nous contacter</h1>
    <p class="auth-sub">Une question, un problème technique, ou une remarque sur la plateforme.</p>

    <div class="auth-form-message" id="msg-contact"></div>

    <form id="form-contact">
      <div class="field">
        <label for="nom">Nom</label>
        <input type="text" id="nom" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required>
      </div>
      <div class="field">
        <label for="sujet">Sujet</label>
        <select id="sujet">
          <option value="general">Général</option>
          <option value="pedagogique">Pédagogique (contenu, validation)</option>
          <option value="technique">Technique (bug, compte)</option>
        </select>
      </div>
      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" rows="5" required></textarea>
      </div>
      <button class="btn-primary" type="submit" id="btn-contact" style="width:100%;">Envoyer</button>
    </form>
  </div>
</main>

<footer class="site-footer">
  <p>Lakou Sces Infirmières — un réseau <a href="https://lakou-inivesite.example">Lakou Inivesite</a> · <a href="confidentialite.html">Confidentialité</a></p>
</footer>

<script>
document.getElementById('form-contact').addEventListener('submit', async function (e) {
  e.preventDefault();
  const btn = document.getElementById('btn-contact');
  const msg = document.getElementById('msg-contact');
  btn.disabled = true; btn.textContent = 'Envoi…';
  msg.className = 'auth-form-message';

  if (!window.supabaseClient) {
    console.error('contact.html : window.supabaseClient introuvable.');
    btn.disabled = false; btn.textContent = 'Envoyer';
    msg.textContent = "Connexion au service impossible. Vérifie la console (F12).";
    msg.className = 'auth-form-message show error';
    return;
  }

  const payload = {
    nom: document.getElementById('nom').value.trim(),
    email: document.getElementById('email').value.trim(),
    sujet: document.getElementById('sujet').value,
    message: document.getElementById('message').value.trim()
  };

  let error;
  try {
    ({ error } = await window.supabaseClient.functions.invoke('contact', { body: payload }));
  } catch (exception) {
    console.error('Exception envoi contact :', exception);
    btn.disabled = false; btn.textContent = 'Envoyer';
    msg.textContent = "La requête n'a pas pu partir. Détail dans la console (F12).";
    msg.className = 'auth-form-message show error';
    return;
  }

  btn.disabled = false; btn.textContent = 'Envoyer';

  if (error) {
    console.error('Erreur Edge Function contact :', error);
    msg.textContent = "Erreur lors de l'envoi. Réessaie dans un instant.";
    msg.className = 'auth-form-message show error';
    return;
  }

  document.getElementById('form-contact').reset();
  msg.textContent = 'Message envoyé — réponse sous quelques jours.';
  msg.className = 'auth-form-message show success';
});
</script>

<script src="partials/nav.js"></script>
</body>
</html>
