<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stages & Terrain — Lakou Sces Infirmières</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
</head>
<body>

<div id="lakou-header"></div>

<div class="breadcrumb">
  <a href="index.html">🏠 Lakou Sces Infirmières</a>
  <span class="sep">›</span>
  <span class="current">Stages & Terrain</span>
</div>

<section class="banniere-hero">
  <div class="banniere-hero-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 21V9l8-6 8 6v12"/><path d="M12 21v-7M9 17h6"/></svg>
  </div>
  <h1>Stages & Terrain</h1>
  <p>Rapports de stage, santé communautaire, expériences en milieu rural — la mémoire du terrain, promotion après promotion.</p>
</section>

<div class="filtres-bar">
  <input type="text" id="champ-recherche" placeholder="Rechercher un titre…">
  <select id="filtre-type">
    <option value="">Tous les types</option>
  </select>
</div>

<div class="archive-grid" id="grille-bannieres">
  <p class="auth-sub">Chargement…</p>
</div>

<footer class="site-footer">
  <p>Lakou Sces Infirmières — un réseau <a href="https://lakou-inivesite.example">Lakou Inivesite</a></p>
</footer>

<script src="bannieres.js"></script>
<script>
if (typeof initBanniere !== 'function') {
  document.getElementById('grille-bannieres').innerHTML = '<p class="auth-sub">Erreur : bannieres.js est introuvable. Vérifie qu\'il est bien déployé à la racine du site.</p>';
} else {
  initBanniere({
    table: 'infirmiere_stages_terrain',
    champs: ['id','titre','description','contenu','fichier_url','type','lieu','annee','created_at'],
    types: [
      ['rapport_stage','Rapport de stage'],
      ['experience_hospitaliere','Expérience hospitalière'],
      ['sante_communautaire','Santé communautaire'],
      ['campagne_vaccination','Campagne de vaccination'],
      ['sensibilisation','Sensibilisation'],
      ['milieu_rural','Milieu rural'],
      ['temoignage','Témoignage']
    ]
  });
}
</script>
<script src="partials/nav.js"></script>
</body>
</html>
