<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revue Infirmière — Lakou Sces Infirmières</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
</head>
<body>

<div id="lakou-header"></div>

<div class="breadcrumb">
  <a href="index.html">🏠 Lakou Sces Infirmières</a>
  <span class="sep">›</span>
  <span class="current">Revue Infirmière</span>
</div>

<section class="banniere-hero">
  <div class="banniere-hero-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19.5A2.5 2.5 0 016.5 17H20M4 19.5A2.5 2.5 0 006.5 22H20V2H6.5A2.5 2.5 0 004 4.5v15z"/></svg>
  </div>
  <h1>Revue Infirmière</h1>
  <p>Portraits, initiatives, actualités et rencontres de terrain — le cœur communautaire du réseau.</p>
</section>

<div class="filtres-bar">
  <input type="text" id="champ-recherche" placeholder="Rechercher un titre…">
  <select id="filtre-type">
    <option value="">Tous les types</option>
  </select>
</div>

<div class="archive-grid" id="grille-bannieres">
  <p class="auth-sub">Chargement…</p>
</div>

<footer class="site-footer">
  <p>Lakou Sces Infirmières — un réseau <a href="https://lakou-inivesite.example">Lakou Inivesite</a></p>
</footer>

<script src="bannieres.js"></script>
<script>
initBanniere({
  table: 'infirmiere_revue',
  champs: ['id','titre','description','contenu','fichier_url','type','created_at'],
  types: [
    ['portrait','Portrait'],
    ['parcours_ancien','Parcours d\'ancien étudiant'],
    ['initiative','Initiative'],
    ['association_promotion','Association / Promotion'],
    ['actualite','Actualité'],
    ['concours_opportunite','Concours / Opportunité'],
    ['conference','Conférence'],
    ['sur_le_terrain','Sur le terrain']
  ]
});
</script>
<script src="partials/nav.js"></script>
</body>
</html>
