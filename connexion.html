<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — Lakou Sces Infirmières</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
</head>
<body>

<div id="lakou-header"></div>

<div class="breadcrumb">
  <a href="index.html">🏠 Lakou Sces Infirmières</a>
  <span class="sep">›</span>
  <span class="current">Connexion</span>
</div>

<main class="auth-main">
  <div class="auth-card">
    <div class="auth-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19.5A2.5 2.5 0 016.5 17H20M4 19.5A2.5 2.5 0 006.5 22H20V2H6.5A2.5 2.5 0 004 4.5v15z"/></svg>
    </div>
    <h1>Bon retour</h1>
    <p class="auth-sub">Connecte-toi pour accéder à ton espace.</p>

    <div class="auth-form-message" id="msg-connexion"></div>

    <form id="form-connexion">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email">
      </div>
      <div class="field">
        <label for="mdp">Mot de passe</label>
        <input type="password" id="mdp" required autocomplete="current-password">
      </div>
      <button class="btn-primary" type="submit" id="btn-connexion-submit" style="width:100%;">Se connecter</button>
    </form>

    <p style="text-align:center; margin-top:14px;">
      <a href="#" id="lien-mdp-oublie" class="auth-switch">Mot de passe oublié ?</a>
    </p>

    <div class="auth-form-message" id="msg-reset"></div>

    <p style="text-align:center; margin-top:18px; font-size:13.5px; color:var(--texte-mute);">
      Pas encore de compte ? <a href="inscription.html" class="auth-switch">Inscris-toi</a>
    </p>
  </div>
</main>

<script>
(async function(){
  const { data: { session } } = await window.supabaseClient.auth.getSession();
  if (session) { window.location.href = 'dashboard.html'; }
})();

function traduireErreur(message){
  if (!message) return "Une erreur est survenue. Réessaie.";
  if (message.includes('Invalid login credentials')) return "Email ou mot de passe incorrect.";
  if (message.includes('Email not confirmed')) return "Confirme ton email avant de te connecter — vérifie ta boîte mail.";
  if (message.includes('rate limit')) return "Trop de tentatives. Réessaie dans quelques minutes.";
  return "Une erreur est survenue. Réessaie.";
}

document.getElementById('form-connexion').addEventListener('submit', async function(e){
  e.preventDefault();
  const btn = document.getElementById('btn-connexion-submit');
  const msg = document.getElementById('msg-connexion');
  btn.disabled = true; btn.textContent = 'Connexion…';
  msg.className = 'auth-form-message';

  const email = document.getElementById('email').value.trim();
  const mdp = document.getElementById('mdp').value;

  if (!window.supabaseClient) {
    console.error('window.supabaseClient est introuvable — supabase-client.js ne s\'est pas chargé ou a échoué.');
    btn.disabled = false; btn.textContent = 'Se connecter';
    msg.textContent = "Connexion au service impossible. Vérifie la console (F12) pour le détail.";
    msg.className = 'auth-form-message show error';
    return;
  }

  let error;
  try {
    ({ error } = await window.supabaseClient.auth.signInWithPassword({ email, password: mdp }));
  } catch (exception) {
    console.error('Exception pendant signInWithPassword() :', exception);
    btn.disabled = false; btn.textContent = 'Se connecter';
    msg.textContent = "La requête n'a pas pu partir (réseau ou configuration). Détail dans la console (F12).";
    msg.className = 'auth-form-message show error';
    return;
  }

  btn.disabled = false; btn.textContent = 'Se connecter';

  if (error) {
    console.error('Erreur Supabase signInWithPassword() :', error);
    msg.textContent = traduireErreur(error.message);
    msg.className = 'auth-form-message show error';
    return;
  }

  window.location.href = 'dashboard.html';
});

document.getElementById('lien-mdp-oublie').addEventListener('click', async function(e){
  e.preventDefault();
  const msg = document.getElementById('msg-reset');
  const email = document.getElementById('email').value.trim();

  if (!email) {
    msg.textContent = "Renseigne d'abord ton email ci-dessus, puis tapote à nouveau ce lien.";
    msg.className = 'auth-form-message show error';
    return;
  }

  const { error } = await window.supabaseClient.auth.resetPasswordForEmail(email);

  if (error) {
    msg.textContent = "Impossible d'envoyer l'email de réinitialisation.";
    msg.className = 'auth-form-message show error';
    return;
  }

  msg.textContent = 'Email de réinitialisation envoyé — vérifie ta boîte mail.';
  msg.className = 'auth-form-message show success';
});
</script>

<script src="partials/nav.js"></script>
</body>
</html>
