<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mémoires & Recherche — Lakou Sces Infirmières</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
</head>
<body>

<div id="lakou-header"></div>

<div class="breadcrumb">
  <a href="index.html">🏠 Lakou Sces Infirmières</a>
  <span class="sep">›</span>
  <span class="current">Mémoires & Recherche</span>
</div>

<section class="banniere-hero">
  <div class="banniere-hero-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
  </div>
  <h1>Mémoires & Recherche</h1>
  <p>Mémoires, enquêtes, études de terrain — la bibliothèque de la recherche infirmière haïtienne, organisée par thématique.</p>
</section>

<div class="filtres-bar">
  <input type="text" id="champ-recherche" placeholder="Rechercher un titre…">
  <select id="filtre-type">
    <option value="">Tous les types</option>
  </select>
  <select id="filtre-tag">
    <option value="">Toutes les thématiques</option>
  </select>
</div>

<div class="archive-grid" id="grille-bannieres">
  <p class="auth-sub">Chargement…</p>
</div>

<footer class="site-footer">
  <p>Lakou Sces Infirmières — un réseau <a href="https://lakou-inivesite.example">Lakou Inivesite</a></p>
</footer>

<script src="bannieres.js"></script>
<script>
if (typeof initBanniere !== 'function') {
  document.getElementById('grille-bannieres').innerHTML = '<p class="auth-sub">Erreur : bannieres.js est introuvable. Vérifie qu\'il est bien déployé à la racine du site.</p>';
} else {
  initBanniere({
    table: 'infirmiere_memoires_recherche',
    champs: ['id','titre','description','contenu','fichier_url','type','tags','created_at'],
    types: [
      ['memoire','Mémoire'],
      ['recherche','Recherche'],
      ['enquete','Enquête'],
      ['etude_terrain','Étude de terrain'],
      ['poster','Poster scientifique'],
      ['article','Article']
    ]
  });
}
</script>
<script src="partials/nav.js"></script>
</body>
</html>
